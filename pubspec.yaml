name: plan_flex
description: "A new Flutter project."

publish_to: 'none'


version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  path: ^1.9.0
  sqflite: ^2.3.3
  url_launcher: ^6.2.6
  cupertino_icons: ^1.0.8
  percent_indicator: ^4.2.3
  connectivity_plus: ^6.1.5
  shared_preferences: ^2.3.2
  flutter_internet_speed_test_pro: ^1.5.1
  image_picker: ^1.1.2
  image_cropper: ^12.2.1
  firebase_core: ^3.15.2
  cloud_firestore: ^5.6.12
  firebase_auth: ^5.7.0
  path_provider: ^2.1.5
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/icon/pf_logo.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/pf_logo.png"
  adaptive_icon_background: "#F4FBF6"
  adaptive_icon_foreground: "assets/icon/pf_logo.png"